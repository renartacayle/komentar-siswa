
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Komentar</title>
<style>
  :root { 
         /* kuning muda lembut */
    --card:#fff7cc;     /* kuning pastel lebih pekat */
    --ink:#3a2f00;      /* coklat tua biar kontras */
    --muted:#7a6f3a;    /* coklat keemasan */
    --line:#ffd633;     /* garis kuning terang */
  }

  html,body {
    
    color:var(--ink);
    margin:0;
    font-family: system-ui, Arial, sans-serif;
  }

  .wrap {
    max-width:100%;     /* full kanan kiri */
    margin:0;
    padding:24px;
  }

  h3 {
    margin:0 0 16px;
    font-size:20px;
    color:#3a2f00;
    text-align:center;
  }

  form {
    background:var(--card);
    border:2px dashed var(--line);   /* biar playful kayak doodle */
    border-radius:14px;
    padding:16px;
    box-shadow:0 4px 8px rgba(0,0,0,.08);
  }

  input, textarea {
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    margin:10px 0;
    background:#fffef5;
  }

  button {
    border: 2px solid #e6b800;    
    background: #ffcc00;          
    color: #222;                  
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight:600;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover {
    background:#ffdb4d;   /* efek hover lebih terang */
  }

  .meta { font-size:12px; color:var(--muted); margin-top:6px }

  .list { margin-top:16px }

  .item {
    background:#fffef5;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 3px 6px rgba(0,0,0,.06);
  }

  .who { font-weight:600; margin-bottom:4px; color:#3a2f00; }
  .when { font-size:12px; color:var(--muted); margin-left:6px }
  .empty { color:var(--muted); font-style:italic; padding:10px 0; text-align:center }
</style>

</head>
<body>
<div class="wrap">
  <h3>Komentar</h3>
  <div id="pageInfo" class="meta"></div>

  <form id="f" autocomplete="off">
    <input id="name" placeholder="Nama" required />
    <textarea id="comment" placeholder="Tulis komentar…" required minlength="2" rows="4"></textarea>
    <button type="submit">Kirim</button>
    <div id="msg" class="meta"></div>
  </form>

  <div id="list" class="list"></div>
</div>

<!-- Firebase (module via CDN, tanpa bundler) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, where, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  // ====== GANTI DENGAN PUNYAMU ======
  const firebaseConfig = {
    apiKey: "AIzaSyDcV_zw1Puhy3hzN3WguRG-sUmW2tnGGUE",
    authDomain: "komentar-91441.firebaseapp.com",
    projectId: "komentar-91441",
    storageBucket: "komentar-91441.firebasestorage.app",
    messagingSenderId: "728735814182",
    appId: "1:728735814182:web:137dd7587f8966d1320ce7",
    // measurementId tidak diperlukan untuk Firestore
  };
  // ===================================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- Tentukan pageId otomatis ---
  function getPageId() {
  const url = new URL(window.location.href);
  return url.searchParams.get("page") || "unknown";
}



  const pageId = getPageId();
 

  // --- Render komentar ---
  // ... import & init Firebase seperti sebelumnya

  async function loadComments() {
    const list = document.getElementById('list');
    list.innerHTML = "";
    const baseCol = collection(db, "comments");

    try {
      // jalur utama: butuh composite index (pageId + ts desc)
      const q1 = query(
        baseCol,
        where("pageId","==", pageId),
        orderBy("ts","desc"),
        limit(50)
      );
      const snap = await getDocs(q1);
      renderSnap(snap);
    } catch (err) {
      // fallback kalau index belum siap / belum ada
      const msg = (""+err.message).toLowerCase();
      const needIndex =
        msg.includes("requires an index") ||
        msg.includes("index is currently building");

      if (!needIndex) throw err;

      // Fallback: tanpa orderBy (nggak perlu composite index)
      // Lalu kita urutkan manual di klien.
      const q2 = query(
        baseCol,
        where("pageId","==", pageId),
        limit(50)
      );
      const snap = await getDocs(q2);

      // urutkan manual
      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a,b) => {
        const ta = a.ts?.toDate ? a.ts.toDate().getTime() : 0;
        const tb = b.ts?.toDate ? b.ts.toDate().getTime() : 0;
        return tb - ta; // desc
      });

      renderDocs(docs);
    }
  }

  function renderSnap(snap) {
    if (snap.empty) {
      document.getElementById('list').innerHTML = `<div class="empty">Belum ada komentar.</div>`;
      return;
    }
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    renderDocs(docs);
  }

  function renderDocs(docs) {
    const list = document.getElementById('list');
    list.innerHTML = "";
    docs.forEach(d => {
      const when = d.ts?.toDate ? d.ts.toDate().toLocaleString() : "";
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="who">${escapeHtml(d.name || "Anon")}
          <span class="when">• ${when}</span>
        </div>
        <div class="text">${linkify(escapeHtml(d.text || ""))}</div>
      `;
      list.appendChild(el);
    });
  }

  // --- Submit komentar ---
  const form = document.getElementById('f');
  const nameEl = document.getElementById('name');
  const commentEl = document.getElementById('comment');
  const msgEl = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.textContent = "Mengirim…";
    const name = nameEl.value.trim();
    const text = commentEl.value.trim();
    if (!name || !text) { msgEl.textContent = "Nama & komentar wajib diisi."; return; }
    try {
      await addDoc(collection(db, "comments"), {
        pageId,
        name,
        text,
        ts: serverTimestamp(),
        ref: document.referrer || null
      });
      commentEl.value = "";
      msgEl.textContent = "Terkirim!";
      loadComments();
    } catch (err) {
      console.error(err);
      msgEl.textContent = "Gagal mengirim. Coba lagi.";
    }
  });

  // --- Helpers ---
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }
  function linkify(s) {
    return s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  loadComments();
</script>
</body>
</html>

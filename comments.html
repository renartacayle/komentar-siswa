<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Komentar</title>
<style>
  :root { 
    --card:#fff7cc;
    --ink:#3a2f00;
    --muted:#7a6f3a;
    --line:#ffd633;
  }
  html,body {
    color:var(--ink);
    margin:0;
    font-family: system-ui, Arial, sans-serif;
    background:#fffef5;
  }
  .wrap { max-width:100%; margin:0; padding:24px; }
  h3 { margin:0 0 16px; font-size:20px; color:#3a2f00; text-align:center; }

  form {
    background:var(--card);
    border:2px dashed var(--line);
    border-radius:14px;
    padding:16px;
    box-shadow:0 4px 8px rgba(0,0,0,.08);
  }
  input, textarea {
    width:100%; border:1px solid var(--line);
    border-radius:10px; padding:12px; font-size:14px; margin:10px 0; background:#fffef5;
  }

  /* ====== BINTANG (RATING) ====== */
  .rate-wrap { margin:8px 0 12px; }
  .rate-label { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .stars {
    display:inline-flex; gap:6px; user-select:none;
  }
  .stars input { display:none; }
  .stars label {
    font-size:22px; line-height:1; cursor:pointer;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.05));
  }
  .stars label::before { content:"☆"; }
  .stars input:checked ~ label::before { content:"☆"; } /* reset kanan */
  /* trik: saat sebuah radio dipilih, semua label SEBELUM-nya jadi ★ */
  .stars label:hover ~ label::before,
  .stars label:hover::before { content:"★"; }
  .stars input:checked + label::before,
  .stars input:checked + label ~ label::before { content:"★"; }

  /* aksesibilitas fokus keyboard */
  .stars label:focus { outline:2px solid var(--line); outline-offset:2px; }

  button {
    border: 2px solid #e6b800; background:#ffcc00; color:#222;
    border-radius:10px; padding:12px 18px; font-size:15px; font-weight:600;
    cursor:pointer; transition: background .2s;
  }
  button:hover { background:#ffdb4d; }

  .meta { font-size:12px; color:var(--muted); margin-top:6px }

  .list { margin-top:16px }
  .item {
    background:#fffef5; border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:12px; box-shadow:0 3px 6px rgba(0,0,0,.06);
  }
  .who { font-weight:600; margin-bottom:4px; color:#3a2f00; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .when { font-size:12px; color:var(--muted); }
  .stars-read { font-size:16px; letter-spacing:2px; }
  .empty { color:var(--muted); font-style:italic; padding:10px 0; text-align:center }
</style>
</head>
<body>
<div class="wrap">
  <h3>Komentar</h3>

  <form id="f" autocomplete="off">
    <input id="name" placeholder="Nama" required />
    <div class="rate-wrap" aria-label="Rating bintang">
      <div class="rate-label">Beri rating:</div>
      <!-- Urutan 1→5 agar screen reader nyaman; styling urus ikon -->
      <div class="stars" role="radiogroup" aria-label="Rating">
        <input type="radio" id="r1" name="rating" value="1" required />
        <label for="r1" title="1 bintang" tabindex="0"></label>

        <input type="radio" id="r2" name="rating" value="2" />
        <label for="r2" title="2 bintang" tabindex="0"></label>

        <input type="radio" id="r3" name="rating" value="3" />
        <label for="r3" title="3 bintang" tabindex="0"></label>

        <input type="radio" id="r4" name="rating" value="4" />
        <label for="r4" title="4 bintang" tabindex="0"></label>

        <input type="radio" id="r5" name="rating" value="5" />
        <label for="r5" title="5 bintang" tabindex="0"></label>
      </div>
    </div>

    <textarea id="comment" placeholder="Tulis komentar…" required minlength="2" rows="4"></textarea>
    <button type="submit">Kirim</button>
    <div id="msg" class="meta"></div>
  </form>

  <div id="list" class="list"></div>
</div>

<!-- Firebase (module via CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, where, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  // ====== GANTI DENGAN PUNYAMU (sudah dari kamu) ======
  const firebaseConfig = {
    apiKey: "AIzaSyDcV_zw1Puhy3hzN3WguRG-sUmW2tnGGUE",
    authDomain: "komentar-91441.firebaseapp.com",
    projectId: "komentar-91441",
    storageBucket: "komentar-91441.firebasestorage.app",
    messagingSenderId: "728735814182",
    appId: "1:728735814182:web:137dd7587f8966d1320ce7",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- Page ID otomatis berbasis path (hindari 'unknown')
  function getPageId() {
    const url = new URL(window.location.href);
    return (url.pathname + url.hash).replace(/[^\w-]/g, "_");
  }
  const pageId = getPageId();

  // --- Load & render komentar
  async function loadComments() {
    const list = document.getElementById('list');
    list.innerHTML = "";
    const baseCol = collection(db, "comments");

    try {
      const q1 = query(
        baseCol,
        where("pageId","==", pageId),
        orderBy("ts","desc"),
        limit(50)
      );
      const snap = await getDocs(q1);
      renderSnap(snap);
    } catch (err) {
      const msg = (""+err.message).toLowerCase();
      const needIndex = msg.includes("requires an index") || msg.includes("index is currently building");
      if (!needIndex) throw err;

      const q2 = query(baseCol, where("pageId","==", pageId), limit(50));
      const snap = await getDocs(q2);
      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a,b) => {
        const ta = a.ts?.toDate ? a.ts.toDate().getTime() : 0;
        const tb = b.ts?.toDate ? b.ts.toDate().getTime() : 0;
        return tb - ta;
      });
      renderDocs(docs);
    }
  }

  function renderSnap(snap) {
    if (snap.empty) {
      document.getElementById('list').innerHTML =
        `<div class="empty">Belum ada komentar.</div>`;
      return;
    }
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    renderDocs(docs);
  }

  function renderDocs(docs) {
    const list = document.getElementById('list');
    list.innerHTML = "";
    docs.forEach(d => {
      const when = d.ts?.toDate ? d.ts.toDate().toLocaleString() : "";
      const r = clampRating(d.rating);
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="who">
          <span>${escapeHtml(d.name || "Anon")}</span>
          ${r ? `<span class="stars-read" aria-label="${r} dari 5">` + stars(r) + `</span>` : ``}
          <span class="when">• ${when}</span>
        </div>
        <div class="text">${linkify(escapeHtml(d.text || ""))}</div>
      `;
      list.appendChild(el);
    });
  }

  // --- Submit komentar + rating
  const form = document.getElementById('f');
  const nameEl = document.getElementById('name');
  const commentEl = document.getElementById('comment');
  const msgEl = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.textContent = "Mengirim…";

    const name = nameEl.value.trim();
    const text = commentEl.value.trim();
    const ratingRaw = document.querySelector('input[name="rating"]:checked')?.value || "";
    const rating = clampRating(Number(ratingRaw));

    if (!name || !text) { msgEl.textContent = "Nama & komentar wajib diisi."; return; }
    if (!rating) { msgEl.textContent = "Pilih rating bintang dulu ya."; return; }

    try {
      await addDoc(collection(db, "comments"), {
        pageId, name, text,
        rating, // <= SIMPAN BINTANG
        ts: serverTimestamp(),
        ref: document.referrer || null
      });
      commentEl.value = "";
      // reset radio
      const checked = document.querySelector('input[name="rating"]:checked');
      if (checked) checked.checked = false;

      msgEl.textContent = "Terkirim!";
      loadComments();
    } catch (err) {
      console.error(err);
      msgEl.textContent = "Gagal mengirim. Coba lagi.";
    }
  });

  // --- Helpers
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }
  function linkify(s) {
    return s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function stars(n) {
    // tampilkan n "★" + (5-n) "☆"
    const full = "★".repeat(n);
    const empty = "☆".repeat(5 - n);
    return full + empty;
  }
  function clampRating(n) {
    if (!Number.isFinite(n)) return 0;
    n = Math.floor(n);
    if (n < 1) return 0;
    if (n > 5) return 5;
    return n;
  }

  loadComments();
</script>
</body>
</html>

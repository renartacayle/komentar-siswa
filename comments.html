<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Komentar</title>
<style>
  :root { 
    --card:#fff7cc;     /* kuning pastel lebih pekat */
    --ink:#3a2f00;      /* coklat tua biar kontras */
    --muted:#7a6f3a;    /* coklat keemasan */
    --line:#ffd633;     /* garis kuning terang */

    /* warna untuk komentar GURU */
    --guru-bg:#e9f2ff;   /* biru muda */
    --guru-line:#99c2ff; /* garis biru lembut */
    --guru-ink:#003366;  /* teks biru tua */
    --guru-sub:#245a9a;  /* teks tambahan */
    --guru-badge:#d6e7ff;/* latar badge */
    --guru-badge-ink:#0b4aa2; /* teks badge */
  }

  html,body {
    background:#fffef5;
    color:var(--ink);
    margin:0;
    font-family: system-ui, Arial, sans-serif;
  }

  .wrap { max-width:100%; margin:0; padding:24px; }
  h3 { margin:0 0 16px; font-size:20px; color:#3a2f00; text-align:center; }

  form {
    background:var(--card);
    border:2px dashed var(--line);
    border-radius:14px;
    padding:16px;
    box-shadow:0 4px 8px rgba(0,0,0,.08);
  }

  input, textarea {
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    margin:10px 0;
    background:#fffef5;
  }

  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }

  /* ====== BINTANG (RATING) — UI lebih klik-able ====== */
  .rate-wrap { margin:10px 0 12px; }
  .rate-label { font-size:13px; color:var(--muted); margin-bottom:6px; }

  .stars {
    display:inline-flex;
    flex-direction: row-reverse;   /* memudahkan ngecat bintang ke kiri */
    gap:6px;
    align-items:center;
    user-select:none;
  }

  /* radio tetap fokus-able (jangan display:none) */
  .stars input {
    position:absolute;
    opacity:0;
    width:1px; height:1px;
    pointer-events:none;
  }

  /* target klik besar biar nyaman di HP */
  .stars label {
    width:36px; height:36px;
    display:inline-grid; place-items:center;
    font-size:26px; line-height:1;
    cursor:pointer;
    border-radius:8px;
    transition: transform .05s ease;
  }
  .stars label:active { transform: scale(.96); }
  .stars label::before { content:"☆"; }

  /* Hover: label yang di-hover + label di kanannya (row-reverse) jadi ★ */
  .stars label:hover::before,
  .stars label:hover ~ label::before { content:"★"; }

  /* Checked: radio terpilih + label di kanannya (row-reverse) jadi ★ */
  .stars input:checked ~ label::before { content:"★"; }

  /* Fokus keyboard terlihat */
  .stars label:focus-visible {
    outline:2px solid var(--line);
    outline-offset:2px;
  }

  /* teks nilai dipilih */
  .rate-value {
    display:inline-block;
    font-size:13px;
    color:var(--muted);
    margin-left:8px;
    min-width:72px; /* stabil biar gak loncat-loncat */
  }

  button {
    border: 2px solid #e6b800;
    background: #ffcc00;
    color: #222;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight:600;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background:#ffdb4d; }

  .meta { font-size:12px; color:var(--muted); margin-top:6px }
  .err  { color:#b30000; }

  .list { margin-top:16px }
  .item {
    background:#fffef5;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 3px 6px rgba(0,0,0,.06);
  }

  /* ====== VARIAN UNTUK KOMENTAR GURU ====== */
  .item.guru {
    background:var(--guru-bg);
    border-color:var(--guru-line);
  }
  .item.guru .who {
    color:var(--guru-ink);
  }
  .item.guru .when {
    color:var(--guru-sub);
  }
  .item.guru .text {
    color:#00284d;
  }
  .badge {
    font-size:12px;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid rgba(0,0,0,.08);
    background:#f4f4f4;
    color:#333;
  }
  .badge.guru {
    background:var(--guru-badge);
    color:var(--guru-badge-ink);
    border-color:var(--guru-line);
  }

  .who { font-weight:600; margin-bottom:4px; color:#3a2f00; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .when { font-size:12px; color:var(--muted); }
  .stars-read { font-size:16px; letter-spacing:2px; }
  .empty { color:var(--muted); font-style:italic; padding:10px 0; text-align:center }
</style>
</head>
<body>
<div class="wrap">
  <h3>Komentar</h3>

  <form id="f" autocomplete="off" novalidate>
    <input id="name" placeholder="Nama" autocomplete="name" required />

    <!-- Opsi "Saya guru" -->
    <label style="font-size:14px; display:flex; align-items:center; gap:6px; margin:6px 0;">
      <input type="checkbox" id="isGuru" style="width:auto; height:auto;">
      Saya guru
    </label>

    <div class="rate-wrap" aria-label="Rating bintang">
      <div class="rate-label">Beri rating:</div>

      <div class="stars" role="radiogroup" aria-label="Rating (1 sampai 5)">
        <!-- urutan 5 → 1 karena row-reverse -->
        <input type="radio" id="r5" name="rating" value="5" />
        <label for="r5" title="5 bintang" tabindex="0" aria-label="5 bintang"></label>

        <input type="radio" id="r4" name="rating" value="4" />
        <label for="r4" title="4 bintang" tabindex="0" aria-label="4 bintang"></label>

        <input type="radio" id="r3" name="rating" value="3" />
        <label for="r3" title="3 bintang" tabindex="0" aria-label="3 bintang"></label>

        <input type="radio" id="r2" name="rating" value="2" />
        <label for="r2" title="2 bintang" tabindex="0" aria-label="2 bintang"></label>

        <input type="radio" id="r1" name="rating" value="1" />
        <label for="r1" title="1 bintang" tabindex="0" aria-label="1 bintang"></label>
      </div>

      <span id="rateValue" class="rate-value" aria-live="polite"></span>
    </div>

    <textarea id="comment" placeholder="Tulis komentar…" required minlength="2" rows="4"></textarea>

    <div class="row">
      <button type="submit" id="btnSend">Kirim</button>
      <div id="msg" class="meta" role="status" aria-live="polite"></div>
    </div>
  </form>

  <div id="list" class="list"></div>
</div>

<!-- Firebase (module via CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp,
    query, where, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  // ====== KONFIG FIREBASE (punyamu) ====== 
  const firebaseConfig = {
    apiKey: "AIzaSyDcV_zw1Puhy3hzN3WguRG-sUmW2tnGGUE",
    authDomain: "komentar-91441.firebaseapp.com",
    projectId: "komentar-91441",
    storageBucket: "komentar-91441.firebasestorage.app",
    messagingSenderId: "728735814182",
    appId: "1:728735814182:web:137dd7587f8966d1320ce7",
  };

  // Init
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // --- Page ID otomatis ---
  function getPageId() {
    const url = new URL(window.location.href);
    // 1) Prioritas query ?page=
    const q = url.searchParams.get("page");
    if (q) return q.trim().replace(/[^\w-]/g, "_");

    // 2) Fallback: gunakan document.referrer (URL halaman induk Google Sites)
    if (document.referrer) {
      try {
        const r = new URL(document.referrer);
        return (r.origin + r.pathname).replace(/[^\w-]/g, "_");
      } catch(_) {}
    }

    // 3) Last resort: path file sendiri
    return (url.pathname + url.hash).replace(/[^\w-]/g, "_") || "unknown";
  }
  const pageId = getPageId();

  // --- Render komentar ---
  async function loadComments() {
    const list = document.getElementById('list');
    list.innerHTML = "";
    const baseCol = collection(db, "comments");

    try {
      // jalur utama: butuh composite index (pageId + ts desc)
      const q1 = query(
        baseCol,
        where("pageId","==", pageId),
        orderBy("ts","desc"),
        limit(50)
      );
      const snap = await getDocs(q1);
      renderSnap(snap);
    } catch (err) {
      // fallback jika index belum ada
      const msg = (""+err.message).toLowerCase();
      const needIndex = msg.includes("requires an index") || msg.includes("index is currently building");
      if (!needIndex) {
        console.error(err);
        document.getElementById('list').innerHTML =
          `<div class="empty">Gagal memuat komentar.</div>`;
        return;
      }
      const q2 = query(
        baseCol,
        where("pageId","==", pageId),
        limit(50)
      );
      const snap = await getDocs(q2);
      const docs = [];
      snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
      docs.sort((a,b) => {
        const ta = a.ts?.toDate ? a.ts.toDate().getTime() : 0;
        const tb = b.ts?.toDate ? b.ts.toDate().getTime() : 0;
        return tb - ta;
      });
      renderDocs(docs);
    }
  }

  function renderSnap(snap) {
    if (snap.empty) {
      document.getElementById('list').innerHTML =
        `<div class="empty">Belum ada komentar.</div>`;
      return;
    }
    const docs = [];
    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
    renderDocs(docs);
  }

  function renderDocs(docs) {
    const list = document.getElementById('list');
    list.innerHTML = "";
    docs.forEach(d => {
      const when = d.ts?.toDate ? d.ts.toDate().toLocaleString() : "";
      const r = clampRating(d.rating);
      const isGuru = (d.role === "guru");
      const el = document.createElement('div');
      el.className = 'item' + (isGuru ? ' guru' : '');
      el.innerHTML = `
        <div class="who">
          <span>${escapeHtml(d.name || "Anon")}</span>
          ${isGuru ? `<span class="badge guru" title="Komentar dari guru">Guru</span>` : ``}
          ${r ? `<span class="stars-read" aria-label="${r} dari 5">${stars(r)}</span>` : ``}
          <span class="when">• ${when}</span>
        </div>
        <div class="text">${linkify(escapeHtml(d.text || ""))}</div>
      `;
      list.appendChild(el);
    });
  }

  // --- Submit komentar ---
  const form = document.getElementById('f');
  const nameEl = document.getElementById('name');
  const commentEl = document.getElementById('comment');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btnSend');
  const isGuruEl = document.getElementById('isGuru');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.classList.remove('err');
    msgEl.textContent = "";

    const name = nameEl.value.trim();
    const text = commentEl.value.trim();
    const ratingRaw = document.querySelector('input[name="rating"]:checked')?.value || "";
    const rating = clampRating(Number(ratingRaw));
    const role = isGuruEl.checked ? "guru" : "murid";

    // Validasi manual (hindari error "not focusable")
    if (!name) { msgEl.textContent = "Nama wajib diisi."; msgEl.classList.add('err'); nameEl.focus(); return; }
    if (!rating) { msgEl.textContent = "Pilih rating bintang."; msgEl.classList.add('err'); return; }
    if (!text || text.length < 2) { msgEl.textContent = "Komentar minimal 2 karakter."; msgEl.classList.add('err'); commentEl.focus(); return; }

    btn.disabled = true;
    msgEl.textContent = "Mengirim…";

    try {
      await addDoc(collection(db, "comments"), {
        pageId,
        name,
        text,
        rating,                 // simpan rating per comment
        role,                   // simpan role
        ts: serverTimestamp(),  // waktu server
        ref: document.referrer || null
      });

      commentEl.value = "";
      // reset radio
      const checked = document.querySelector('input[name="rating"]:checked');
      if (checked) checked.checked = false;
      // reset teks rating
      updateSelectedText('');
      // opsional reset role
      // isGuruEl.checked = false;

      msgEl.classList.remove('err');
      msgEl.textContent = "Terkirim!";
      loadComments();
    } catch (err) {
      console.error(err);
      msgEl.classList.add('err');
      msgEl.textContent = "Gagal mengirim (izin Firestore?).";
    } finally {
      btn.disabled = false;
    }
  });

  // --- Helpers umum ---
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }
  function linkify(s) {
    return s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function stars(n) {
    return "★".repeat(n) + "☆".repeat(5-n);
  }
  function clampRating(n) {
    if (!Number.isFinite(n)) return 0;
    n = Math.floor(n);
    if (n < 1) return 0;
    if (n > 5) return 5;
    return n;
  }

  // --- UI rating: nilai terpilih & hover preview ---
  const rateValueEl = document.getElementById('rateValue');
  const starRadios = [...document.querySelectorAll('input[name="rating"]')];
  const starLabels = [...document.querySelectorAll('.stars label')];

  function updateSelectedText(val) {
    rateValueEl.textContent = val ? `${val} / 5` : '';
  }

  // saat user memilih (klik radio)
  starRadios.forEach(r => {
    r.addEventListener('change', () => updateSelectedText(r.value));
  });

  // hover preview: tulis sementara (tanpa mengubah pilihan)
  starLabels.forEach((label) => {
    label.addEventListener('mouseenter', () => {
      const forId = label.getAttribute('for');
      const radio = document.getElementById(forId);
      updateSelectedText(radio?.value || '');
    });
  });
  document.querySelector('.stars').addEventListener('mouseleave', () => {
    const selected = document.querySelector('input[name="rating"]:checked')?.value || '';
    updateSelectedText(selected);
  });

  // Muat komentar awal
  loadComments();
</script>
</body>
</html>

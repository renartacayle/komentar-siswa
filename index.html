<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Komentar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { padding: 20px; }
    .skeleton {height:72px;border-radius:.5rem;margin-bottom:.5rem;
      background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);
      background-size:400% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  </style>
</head>
<body>
<div class="container" style="max-width:720px">
  <h4 class="mb-3">Komentar</h4>

  <!-- Google Sign In -->
  <div id="g_id_onload"
       data-client_id="YOUR_CLIENT_ID.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-use_fedcm_for_prompt="true"></div>
  <div class="g_id_signin mb-3" data-type="standard" data-size="large"></div>

  <form id="formKomentar" class="mb-3" novalidate>
    <input type="hidden" id="idKonten" value="">
    <div class="mb-2" id="rowNama">
      <label for="namaPengguna" class="form-label">Nama</label>
      <input type="text" id="namaPengguna" class="form-control" placeholder="Nama Anda" required maxlength="60">
    </div>
    <div class="mb-2">
      <label for="isiKomentar" class="form-label">Komentar</label>
      <textarea id="isiKomentar" class="form-control" rows="3" required maxlength="1000" placeholder="Tulis komentar..."></textarea>
    </div>
    <button type="submit" id="btnKirim" class="btn btn-primary">Kirim</button>
  </form>

  <div id="daftarKomentar">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<script>
  const sheetAPI = "YOUR_SHEET_API_URL"; // ganti URL Apps Script kamu

  // --- Google login ---
  function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
  }

  function handleCredentialResponse(response) {
    try {
      const data = parseJwt(response.credential);
      if (data?.name) {
        const inp = document.getElementById('namaPengguna');
        inp.value = data.name;
        inp.readOnly = true;
        document.getElementById('rowNama').style.display = 'none'; // sembunyikan field
      }
    } catch(e) { console.error(e); }
  }

  // --- ID konten (pakai slug halaman Google Sites) ---
  function getIdKonten() {
    try {
      const ref = document.referrer ? new URL(document.referrer) : null;
      if (ref) {
        const segs = ref.pathname.split('/').filter(Boolean);
        return decodeURIComponent(segs[segs.length - 1] || '');
      }
    } catch(e){}
    return 'default';
  }

  // --- Render komentar ---
  function esc(s=''){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
  function renderList(items){
    if(!items || !items.length){
      document.getElementById('daftarKomentar').innerHTML='<div class="text-muted">Belum ada komentar.</div>';
      return;
    }
    const html = items.slice().reverse().map(it=>`
      <div class="card mb-2"><div class="card-body">
        <strong>${esc(it.namaPengguna||'Anonim')}</strong><br>
        <small class="text-muted">${esc(it.waktu||'')}</small>
        <p class="mb-0" style="white-space:pre-wrap">${esc(it.isiKomentar||'')}</p>
      </div></div>`).join('');
    document.getElementById('daftarKomentar').innerHTML = html;
  }

  async function muatKomentar(){
    const id = getIdKonten();
    document.getElementById('idKonten').value = id;
    try {
      const r = await fetch(`${sheetAPI}?idKonten=${encodeURIComponent(id)}`, {cache:'no-store'});
      const data = await r.json();
      renderList(Array.isArray(data)?data:[]);
    } catch(e) {
      document.getElementById('daftarKomentar').innerHTML='<div class="text-danger">Gagal memuat komentar.</div>';
    }
  }

  // --- Kirim komentar ---
  document.getElementById('formKomentar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const namaPengguna = document.getElementById('namaPengguna').value.trim();
    const isiKomentar = document.getElementById('isiKomentar').value.trim();
    const idKonten = document.getElementById('idKonten').value;
    if (!namaPengguna || !isiKomentar) return;
    try {
      await fetch(sheetAPI, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ idKonten, namaPengguna, isiKomentar })
      });
      document.getElementById('formKomentar').reset();
      muatKomentar();
    } catch(err) {
      alert("Komentar gagal dikirim.");
    }
  });

  window.addEventListener('load', muatKomentar);
</script>
</body>
</html>

<!doctype html>

    body {

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fffdf6;
    }
    .love-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid #ffd966;
      background: #fff7c2;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
    }
    .love-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 16px;
      cursor: pointer;
      background: #ff4b6a;
      color: white;
    }
    .love-btn:active {
      transform: scale(0.96);
    }
    .love-count {
      font-weight: 600;
      color: #5a3b00;
      min-width: 24px;
      text-align: right;
    }
    .status {
      font-size: 12px;
      color: #7a6f3a;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>

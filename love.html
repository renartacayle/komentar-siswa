<script type="module">
  // ========= 1. IMPORT FIREBASE =========
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  // ========= 2. KONFIGURASI FIREBASE (pakai punyamu yang sudah jalan) =========
  const firebaseConfig = {
    apiKey: "AIzaSyDcV_zw1Puhy3hzN3WguRG-sUmW2tnGGUE",
    authDomain: "komentar-91441.firebaseapp.com",
    projectId: "komentar-91441",
    storageBucket: "komentar-91441.firebasestorage.app",
    messagingSenderId: "728735814182",
    appId: "1:728735814182:web:137dd7587f8966d1320ce7",
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ========= 3. PAGE_ID dari ?page=... =========
  const params  = new URLSearchParams(window.location.search);
  const PAGE_ID = params.get("page") || "unknown";

  const loveDocRef = doc(db, "loveCounters", PAGE_ID);

  const loveBtn     = document.getElementById("love-btn");
  const loveCountEl = document.getElementById("love-count");
  const statusEl    = document.getElementById("status");

  function setStatus(msg) {
    statusEl.textContent = msg || "";
  }

  // ========= 4. INIT: BACA / BUAT DOKUMEN + LISTENER REALTIME =========
  async function initLove() {
    setStatus("Memuat...");
    try {
      const snap = await getDoc(loveDocRef);

      if (!snap.exists()) {
        await setDoc(loveDocRef, { count: 0 });
        loveCountEl.textContent = "0";
      } else {
        const data = snap.data();
        loveCountEl.textContent = (data.count ?? 0).toString();
      }

      // realtime listener (kalau konek)
      onSnapshot(loveDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          loveCountEl.textContent = (data.count ?? 0).toString();
        }
      });

      setStatus(""); // clear "Memuat..."
    } catch (err) {
      console.error("initLove error:", err);

      // ==== HANDLE KHUSUS KETIKA DIANGGAP OFFLINE ====
      // offline: gagal getDoc, tapi kita tetap set UI ke 0
      if (err.code === "unavailable" || err.message?.includes("client is offline")) {
        loveCountEl.textContent = "0";
        setStatus("Offline mode");
        // tidak throw lagi, biar widget tetap bisa dipakai
      } else {
        setStatus("Gagal memuat (" + (err.code || "cek console") + ")");
      }
    }
  }

  // ========= 5. HANDLE klik tombol =========
  loveBtn.addEventListener("click", async () => {
    setStatus("Mengirim...");
    loveBtn.disabled = true;

    try {
      await updateDoc(loveDocRef, {
        count: increment(1)
      });
      setStatus("❤️ OK");
    } catch (err) {
      console.warn("updateDoc gagal:", err);
      try {
        const snap = await getDoc(loveDocRef);
        if (!snap.exists()) {
          await setDoc(loveDocRef, { count: 1 });
          loveCountEl.textContent = "1";
          setStatus("❤️ pertama");
        } else {
          setStatus("Gagal kirim (" + (err.code || "err") + ")");
        }
      } catch (err2) {
        console.error("setDoc fallback error:", err2);
        setStatus("Error total");
      }
    } finally {
      loveBtn.disabled = false;
    }
  });

  initLove();
</script>

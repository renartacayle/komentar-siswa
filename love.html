<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Love Button</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    margin:0; padding:6px;
    text-align:center;
    background:#fffef5;
    color:#3a2f00;
  }

  .love-btn {
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid #ff99bb;
    background:#ffe6f0;
    border-radius:999px;
    padding:6px 14px;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 2px 4px rgba(0,0,0,.06);
    transition:.15s;
  }

  .love-btn:hover {
    transform:translateY(-1px);
    box-shadow:0 3px 8px rgba(0,0,0,.1);
  }

  .love-btn:active {
    transform:translateY(0);
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }

  .love-btn[disabled] {
    opacity:.6;
    cursor:wait;
  }

  .love-icon {
    font-size:18px;
  }

  .love-count {
    font-weight:600;
  }
</style>
</head>
<body>

<button id="loveBtn" class="love-btn">
  <span id="loveIcon" class="love-icon">♡</span>
  <span id="loveCount" class="love-count">0</span>
  <span>love</span>
</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getFirestore,
    doc, setDoc, updateDoc, onSnapshot, increment
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  // ==== Firestore ====
  const firebaseConfig = {
    apiKey: "AIzaSyDcV_zw1Puhy3hzN3WguRG-sUmW2tnGGUE",
    authDomain: "komentar-91441.firebaseapp.com",
    projectId: "komentar-91441",
    storageBucket: "komentar-91441.firebasestorage.app",
    messagingSenderId: "728735814182",
    appId: "1:728735814182:web:137dd7587f8966d1320ce7",
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ====== PAGE ID ======
  function getPageId() {
    const url = new URL(window.location.href);
    const q = url.searchParams.get("page");
    if (q) return q.trim().replace(/[^\w-]/g, "_");

    if (document.referrer) {
      try {
        const r = new URL(document.referrer);
        return (r.origin + r.pathname).replace(/[^\w-]/g, "_");
      } catch(_) {}
    }

    return (url.pathname + url.hash).replace(/[^\w-]/g, "_") || "unknown";
  }
  const pageId = getPageId();

  // ====== LOVE DOC ======
  const loveBtn     = document.getElementById('loveBtn');
  const loveIconEl  = document.getElementById('loveIcon');
  const loveCountEl = document.getElementById('loveCount');

  const loveRef = doc(db, "love", pageId);

  // inisialisasi (kalau belum ada, dibuat; kalau sudah ada, cuma merge)
  async function ensureLoveDoc() {
    try {
      await setDoc(loveRef, { count: 0 }, { merge: true });
    } catch (err) {
      console.error("Gagal ensureLoveDoc:", err);
    }
  }

  // realtime updater
  onSnapshot(loveRef, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      const c = typeof data.count === "number" ? data.count : 0;
      loveCountEl.textContent = c;
      loveIconEl.textContent  = c > 0 ? "❤" : "♡";
    } else {
      loveCountEl.textContent = "0";
      loveIconEl.textContent  = "♡";
    }
  });

  // klik → increment
  loveBtn.addEventListener("click", async () => {
    loveBtn.disabled = true;
    try {
      await ensureLoveDoc();
      await updateDoc(loveRef, { count: increment(1) });
    } catch (err) {
      console.error("Gagal menambah love:", err);
    } finally {
      loveBtn.disabled = false;
    }
  });

  // init
  ensureLoveDoc();
</script>

</body>
</html>

      console.error("Gagal ensureLoveDoc:", err);

  onSnapshot(loveRef, (snap) => {
